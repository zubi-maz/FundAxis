# Test-only profile. Production datasource and startup configuration are unchanged.
spring.datasource.url=jdbc:h2:mem:fundaxis_full_build;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath*:reporting-schema.sql,classpath*:reporting-startup-fixtures.sql
spring.jpa.open-in-view=false
