# File: src/main/resources/application.properties

spring.application.name=FundAxis
server.port=4041

# ---------- SQL Server connection ----------
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=fundaxis;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ---------- JPA / Hibernate ----------
#spring.jpa.hibernate.ddl-auto=none
#spring.jpa.show-sql=false
#spring.jpa.properties.hibernate.format_sql=false


spring.jpa.hibernate.ddl-auto=none
 spring.jpa.show-sql=true
 spring.jpa.properties.hibernate.format_sql=true

# Withdrawal setup is opt-in after reviewing the manual schema and bank workflow.
# Approval and posting require separate policy confirmation; monetary/profit posting is unavailable.


#fundaxis.withdrawals.enabled=false
#fundaxis.withdrawals.approval-enabled=false
#fundaxis.withdrawals.posting-enabled=false



# Hibernate must not automatically modify the database
#spring.jpa.hibernate.ddl-auto=none

# Share Withdrawal Configuration
fundaxis.withdrawals.enabled=true
fundaxis.withdrawals.approval-enabled=false
fundaxis.withdrawals.posting-enabled=false

# Loan approval stays disabled until an independent checker authority and the
# applicable bank approval policy are formally configured.
fundaxis.loans.approval-enabled=false
